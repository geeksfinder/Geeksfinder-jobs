name: Scheduled pipelines

on:
  schedule:
    # Times are UTC; IST = UTC + 5:30. (Public repo: Actions minutes are unlimited. As a private repo this schedule
    # used about 1,500 of the free 2,000 minutes a month.)
    - cron: "30 0 * * *"      # 06:00 IST — fetch, dedupe, enrich, match (before the 7:30 alerts)
    - cron: "0 0-17 * * *"    # hourly 05:30–22:30 IST — alerts for users whose alert time is now (alert hours are 5–22)
    - cron: "15 3,13 * * *"   # 08:45 and 18:45 IST — news + guides → reviewed drafts (auto-published when every check passes)
    - cron: "15 16 * * *"     # 21:45 IST — daily report email to admins
  workflow_dispatch:
    inputs:
      task:
        description: "ingest | notify | news | report"
        required: true
        default: ingest

# The built-in GitHub token can only read the code: no pushes, releases or settings changes from a job
permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.schedule || inputs.task }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_BLOG_API_KEY: ${{ secrets.GEMINI_BLOG_API_KEY }}   # optional, blog only
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}   # must match the website, or email unsubscribe links fail
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}   # auto-published articles are posted to the channel
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}                 # tells Bing about new articles
      JSEARCH_RUNS_PER_DAY: "1"   # the cloud fetches jobs once a day (06:00 IST); each run gets the full daily share of the free quota
      AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH }}   # optional secret: set it to 0 to stop blog auto-publishing (drafts then wait for review)
      # Optional: public values the alerts and emails show. Leave unset to use the defaults in web/src/lib/site.ts.
      NEXT_PUBLIC_TELEGRAM_BOT_USERNAME: ${{ secrets.NEXT_PUBLIC_TELEGRAM_BOT_USERNAME }}
      NEXT_PUBLIC_TELEGRAM_CHANNEL: ${{ secrets.NEXT_PUBLIC_TELEGRAM_CHANNEL }}
      NEXT_PUBLIC_CONTACT_EMAIL: ${{ secrets.NEXT_PUBLIC_CONTACT_EMAIL }}
      ADMIN_TELEGRAM_CHAT_ID: ${{ secrets.ADMIN_TELEGRAM_CHAT_ID }}   # optional: admin alerts go to owners' Telegram if unset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Pick task
        id: task
        run: |
          case "${{ github.event.schedule }}" in
            "30 0 * * *")    echo "t=ingest" >> "$GITHUB_OUTPUT" ;;
            "0 0-17 * * *")  echo "t=notify" >> "$GITHUB_OUTPUT" ;;
            "15 3,13 * * *") echo "t=news"   >> "$GITHUB_OUTPUT" ;;
            "15 16 * * *")   echo "t=report" >> "$GITHUB_OUTPUT" ;;
            *)              echo "t=${{ inputs.task }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Run
        run: |
          if [ "${{ steps.task.outputs.t }}" = "news" ]; then npx tsx scripts/news.ts && npx tsx scripts/review-drafts.ts
          elif [ "${{ steps.task.outputs.t }}" = "report" ]; then npx tsx scripts/report.ts
          else npx tsx scripts/cron.ts "${{ steps.task.outputs.t }}"; fi
